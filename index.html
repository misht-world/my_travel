<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Планировщик поездок</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --panel2:#f9fafb; --text:#1f2328; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2563eb; --accent-soft:#e8efff; --ok:#16a34a; --ok-soft:#e7f7ec; --warn:#d97706; --warn-soft:#fff4e0;
  --bad:#dc2626; --bad-soft:#fde8e8; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14161a; --panel:#1d2025; --panel2:#23272d; --text:#e6e8eb; --muted:#9aa1ab; --line:#30353c;
  --accent:#6b9bff; --accent-soft:#1f2a44; --ok:#4ade80; --ok-soft:#173222; --warn:#fbbf24; --warn-soft:#3a2d12;
  --bad:#f87171; --bad-soft:#3d1c1c; --shadow:0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#14161a; --panel:#1d2025; --panel2:#23272d; --text:#e6e8eb; --muted:#9aa1ab; --line:#30353c;
  --accent:#6b9bff; --accent-soft:#1f2a44; --ok:#4ade80; --ok-soft:#173222; --warn:#fbbf24; --warn-soft:#3a2d12;
  --bad:#f87171; --bad-soft:#3d1c1c; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--bad)} button.ghost{border-color:transparent;background:transparent}
button.sm{padding:2px 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
#app{display:flex;height:100vh}
#sidebar{width:250px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{font-weight:700;font-size:17px;padding:16px 16px 8px}
#newTrip{margin:4px 12px 10px}
#tripList{flex:1;overflow:auto;padding:0 8px}
.trip-item{padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border-left:4px solid transparent}
.trip-item:hover{background:var(--panel2)} .trip-item.active{background:var(--accent-soft)}
.trip-item .t{font-weight:600} .trip-item .d{font-size:12px;color:var(--muted)}
.side-foot{padding:10px 12px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px}
.side-foot button{flex:1;font-size:12px;padding:5px 6px}
#main{flex:1;overflow:auto;padding:22px 28px 60px}
.head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.head h1{margin:0;font-size:24px}
.sub{color:var(--muted)}
.grow{flex:1}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:20px} .stat span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:12px 0 18px;flex-wrap:wrap;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.tab{padding:9px 16px;border:1px solid transparent;border-radius:9px;background:none;color:var(--text);font-size:15px;font-weight:600;opacity:.75}
.tab:hover{background:var(--accent-soft);opacity:1;border-color:transparent}
.tab.active{background:var(--accent);color:#fff;opacity:1;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.day{display:grid;grid-template-columns:86px 1fr;gap:14px}
.day.today{outline:2px solid var(--accent)}
.day.weekend .dnum{color:var(--bad)}
.dcol{text-align:center;border-right:1px solid var(--line);padding-right:10px}
.dnum{font-size:26px;font-weight:700;line-height:1.1}
.dmeta{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap}
.row .ic{width:22px;text-align:center;flex:none}
.pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.alert{padding:8px 12px;border-radius:8px;margin:6px 0}
.alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--muted)} .small{font-size:12px}
.done{text-decoration:line-through;opacity:.6}
.note{white-space:pre-wrap;color:var(--muted);font-size:13px;margin-top:4px}
.list-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.item-title{font-weight:600;font-size:15px}
.item-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
table.t{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
table.t th{background:var(--panel2);font-size:12px;color:var(--muted);font-weight:600}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:700}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:48px}
.check{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line)}
.check input{width:auto}
.addbar{display:flex;gap:8px;margin-bottom:12px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap} .filters select,.filters input{width:auto}
.bar{height:10px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--ok)}
.pk-res{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
/* calendar */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);background:var(--panel2);border-bottom:1px solid var(--line)}
.cal-head div{padding:6px 8px;font-size:12px;color:var(--muted);font-weight:600}
.week{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));min-height:92px}
.cell{grid-row:1/-1;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.cell:hover{background:var(--accent-soft)}
.cell.out{background:var(--panel2);cursor:default;opacity:.55}
.cell.nostay{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 7px,transparent 7px 14px)}
.cell.dbl{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad)}
.cbar.conflict{outline:2px dashed var(--bad);outline-offset:1px}
.cbar.conflict::before{content:'⛔ '}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.week .dl{grid-row:1;padding:4px 7px;font-size:13px;font-weight:600;pointer-events:none;z-index:1}
.cell.weekend + .dl{color:var(--bad)}
.cbar{z-index:2;margin:2px 1px;border-radius:7px;color:#fff;font-size:12px;line-height:20px;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.cbar.cutL{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.cbar.cutR{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.cchip{z-index:2;margin:1px 4px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-size:11px;line-height:18px;padding:1px 5px;overflow:hidden;cursor:pointer;border:1px solid var(--accent);min-width:0}
.cchip .cc-route{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cchip .cc-meta{font-size:10px;line-height:14px;opacity:.85;white-space:nowrap}
.week .info{z-index:1;padding:3px 7px 6px;font-size:11px;color:var(--muted);pointer-events:none;overflow:hidden;align-self:end}
/* route map */
.maprow{display:grid;grid-template-columns:1fr 280px;gap:12px;align-items:start}
#routeMap{height:560px;border-radius:12px;border:1px solid var(--line);z-index:0}
.stoplist{max-height:560px;overflow:auto;margin:0}
.stoplist .row{align-items:flex-start;flex-wrap:nowrap}
.mk{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);flex:none;white-space:nowrap}
.leaflet-container .mk{transform:translateZ(0)}
.mk.sleep{background:#dc2626;position:relative;gap:3px}
.mk svg{width:13px;height:13px;fill:#fff;flex:none}
.mk .nb{position:absolute;top:-8px;right:-8px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:#fff;color:#dc2626;border:1.5px solid #dc2626;font-size:10px;line-height:13px;font-weight:800;text-align:center}
/* day editor */
.prow .grip{cursor:grab;color:var(--muted);user-select:none;padding:0 2px}
.prow.dragging{opacity:.4}
.card.dropover{outline:2px dashed var(--accent);background:var(--accent-soft)}
.selbar{position:sticky;bottom:12px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.selbar select{width:auto}
.dm-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.dm-row select,.dm-row input{width:auto}
@media (max-width:900px){ .maprow{grid-template-columns:1fr} #routeMap{height:420px} }
/* travel guide (printed to PDF) */
#guide{display:none;
  --bg:#fff; --panel:#fff; --panel2:#f6f7f9; --text:#1f2328; --muted:#6b7280; --line:#e3e6ea;
  --accent:#2563eb; --accent-soft:#e8efff; --ok:#16a34a; --ok-soft:#e7f7ec; --warn:#d97706; --warn-soft:#fff4e0; --bad:#dc2626; --bad-soft:#fde8e8;
  color:#1f2328;background:#fff;font:12.5px/1.45 "Segoe UI",system-ui,sans-serif}
#guide a{color:#1d4ed8;text-decoration:none}
.g h2{font-size:20px;margin:0 0 12px;padding-bottom:6px;border-bottom:3px solid var(--accent)}
.g h3{font-size:15px;margin:18px 0 8px}
.g-page{break-before:page}
.g-cover{text-align:center;padding-top:30px}
.g-kicker{letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-size:12px}
.g-cover h1{font-size:38px;margin:6px 0 4px}
.g-dates{font-size:16px;color:#374151;margin-bottom:14px}
.g-chain{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center;margin:0 auto 18px;max-width:700px}
.g-stop{display:inline-block;padding:3px 10px;border-radius:99px;background:#e8efff;color:#1d4ed8;font-weight:600}
.g-stop.sleep{background:#dc2626;color:#fff}
.g-stop small{font-weight:400;opacity:.85}
.g-arr{color:var(--muted)}
.g-legend{font-size:11px;color:var(--muted);margin-top:6px}
.smap{position:relative;overflow:hidden;border-radius:10px;border:1px solid var(--line);margin:8px auto;max-width:100%;background:#e5e7eb}
.smap img{position:absolute;display:block;max-width:none}
.smap svg{position:absolute;left:0;top:0}
.smap-attr{position:absolute;right:4px;bottom:2px;font-size:9px;color:#555;background:rgba(255,255,255,.7);padding:0 3px;border-radius:3px}
.g-table{width:100%;border-collapse:collapse;font-size:12px}
.g-table th{background:#f1f3f6;text-align:left;padding:6px 7px;border:1px solid var(--line);font-size:11px;color:#374151}
.g-table td{padding:6px 7px;border:1px solid var(--line);vertical-align:top}
.g-table td.c{text-align:center}
.g-table tr.warn td{background:#fff4e0;color:#b45309}
.g-sm{font-size:11px;color:var(--muted)}
.g-day{break-inside:avoid-page;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.g-dayhead{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.g-daynum{font-size:28px;font-weight:800;line-height:1;text-align:center;min-width:50px;color:var(--accent)}
.g-daynum small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.g-daytitle{font-size:17px;font-weight:700}
.g-note{background:#e8efff;border-radius:8px;padding:6px 10px;margin:6px 0;white-space:pre-wrap}
.g-line{margin:5px 0}
.g-line.warn{color:var(--bad);font-weight:600}
.g-wx{margin:4px 0 6px;padding:5px 10px;background:#f0f9ff;border-radius:8px;font-size:12px}
.g-trans{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:#f6f7f9;border-radius:0 8px 8px 0}
.g-tag{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:99px;background:#fff;border:1px solid var(--line);color:#374151}
.g-stay{margin:6px 0;padding:6px 10px;border-left:3px solid #dc2626;background:#fdf2f2;border-radius:0 8px 8px 0}
.g-stay.g-out{border-left-color:#d97706;background:#fff7ed}
.g-time{font-size:10.5px;color:#374151;margin-top:2px}
.g-place{display:flex;gap:12px;padding:8px 0;border-top:1px dashed var(--line);break-inside:avoid}
.g-photo{width:120px;height:86px;object-fit:cover;border-radius:8px;flex:none}
.g-pbody{flex:1;min-width:0}
.g-ptitle{font-size:13.5px}
.g-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;margin-right:6px}
.g-ex{color:#4b5563;font-size:11.5px;margin:3px 0}
.g-links{font-size:11.5px;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.g-staycard{border:1px solid var(--line);border-left:5px solid;border-radius:10px;padding:10px 12px;margin-bottom:10px;break-inside:avoid}
.g-check{columns:2;font-size:13px}
.g-notes{white-space:pre-wrap}
.g-foot{margin-top:24px;text-align:center;font-size:10px;color:var(--muted)}
#guide .cal{font-size:11px}
#guide .week{min-height:74px}
#guide .cchip{line-height:1.25;padding:2px 5px;font-size:10.5px}
#guide .cchip .cc-route{white-space:normal}
#guide .cbar{font-size:11px}
.g-sum td{font-size:11.5px}
.g-cc{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;padding:1px 5px 1px 3px;border-radius:5px;background:#eef0f3;color:#4b5563;white-space:nowrap;margin:1px 0}
.g-cc.sch{background:#1e40af;color:#fff}
.g-flag{width:14px;height:10px;object-fit:cover;border-radius:1px;box-shadow:0 0 0 .5px rgba(0,0,0,.25)}
@media print{
  @page{size:A4;margin:12mm}
  @page land{size:A4 landscape;margin:10mm}
  .g-land{page:land}
  body.print-guide #app,body.print-guide #modal,body.print-guide #toast{display:none!important}
  body.print-guide{background:#fff}
  body.print-guide #guide{display:block}
  #guide,#guide *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* icons: one monochrome line style everywhere */
.i{width:18px;height:18px;flex:none;vertical-align:-4px}
.row .ic{width:24px;display:inline-flex;justify-content:center;color:var(--muted)}
.pill .i{width:13px;height:13px;vertical-align:-2px}
button .i{width:16px;height:16px;vertical-align:-3px}
button.sm .i{width:15px;height:15px}
.tab .i{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.grip .i{width:16px;height:16px}
.cchip .i,.cbar .i{width:12px;height:12px;vertical-align:-2px}
#guide .i{width:13px;height:13px;vertical-align:-2px}
/* day card groups: transfers / places / stay */
.dgroup{margin:10px 0 4px;padding:2px 0 2px 12px;border-left:3px solid var(--gc)}
.dgroup-h{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gc);margin-bottom:2px}
.dgroup-h .i{width:14px;height:14px}
.dgroup .row .ic{color:var(--gc)}
.dg-move{--gc:#2563eb} .dg-places{--gc:#16a34a} .dg-stay{--gc:#dc2626}
:root[data-theme="dark"] .dg-move{--gc:#6b9bff} :root[data-theme="dark"] .dg-places{--gc:#4ade80} :root[data-theme="dark"] .dg-stay{--gc:#f87171}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .dg-move{--gc:#6b9bff} :root:not([data-theme="light"]) .dg-places{--gc:#4ade80} :root:not([data-theme="light"]) .dg-stay{--gc:#f87171} }
.item-title[data-edit]{cursor:pointer}
.item-title[data-edit]:hover{color:var(--accent)}
.lg-lines{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.lg-lines span{display:inline-flex;align-items:center;gap:4px}
.lg-lines .i{width:14px;height:14px}
/* detail cards (Жильё / Транспорт / Места) */
.rcard{display:grid;grid-template-columns:1fr 260px;gap:16px;padding:14px 16px}
.rbody{min-width:0}
.rhead{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.ric{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.ric .i{width:22px;height:22px}
.rtitle{font-size:17px;font-weight:700;cursor:pointer;line-height:1.25}
.rtitle:hover{color:var(--accent)}
.ctools{display:flex;gap:2px;flex:none}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:6px 0 10px}
.fact{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.fact span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fact b{display:flex;align-items:center;gap:4px;font-size:15px;word-break:break-word}
.fact small{color:var(--muted);font-size:12px}
.dline{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:13.5px}
.dline>.i{color:var(--muted);margin-top:1px}
.rnote{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:7px 10px;margin:8px 0;white-space:pre-wrap;font-size:13.5px}
.rnote>.i{flex:none;margin-top:1px}
.rlinks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.lbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font-size:13px;text-decoration:none;cursor:pointer;font:inherit;font-size:13px}
.lbtn:hover{border-color:var(--accent);text-decoration:none}
.lbtn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.lbtn .i{width:16px;height:16px}
.cbtn{padding:2px 4px;border:none;background:none;color:var(--muted);cursor:pointer}
.cbtn .i{width:14px;height:14px}
.cbtn:hover{color:var(--accent)}
.rmap{display:flex;align-items:flex-start;justify-content:center}
.rmap .smap{margin:0;max-width:100%}
.rmap-empty{border:1px dashed var(--line);border-radius:10px;padding:14px;text-align:center;align-items:center;min-height:120px}
.rroute{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:4px 0 10px}
.rstop{padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:13.5px}
.rstop.a{border-color:var(--accent)} .rstop.b{border-color:var(--bad)}
.rarrow{color:var(--muted);display:inline-flex}
.rarrow{font-weight:700}
.pgroup{margin:18px 0 8px;font-size:15px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pcard{padding:0;overflow:hidden;display:flex;flex-direction:column;margin:0}
.pcard.pdone{opacity:.7}
.pcard.pdone .rtitle{text-decoration:line-through}
.pphoto{display:block;width:100%;height:150px;object-fit:cover;background:var(--panel2)}
.pmap{height:130px;overflow:hidden;display:flex;justify-content:center}
.pmap .smap{border:none;border-radius:0;margin:0}
.pbody{padding:12px 14px;display:flex;flex-direction:column;flex:1}
.pbody .rlinks{margin-top:auto;padding-top:8px}
.pchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.pex{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 4px}
.pdone-cb{display:inline-flex;align-items:center;gap:2px;cursor:pointer;color:var(--muted);flex:none}
.pdone-cb input{width:auto}
#toast.has-btn{pointer-events:auto}
#toast button{margin-left:10px;background:#fff;color:#111;border:none;padding:3px 10px;border-radius:6px;font-weight:600}
@media (max-width:760px){ .rcard{grid-template-columns:1fr} .rmap{justify-content:flex-start} }
.pex-wrap{display:flex;gap:4px;align-items:flex-start}
.pex-wrap .cbtn{opacity:.5} .pex-wrap:hover .cbtn{opacity:1}
.fact.pay-paid{background:var(--ok-soft);border-color:transparent} .fact.pay-paid b{color:var(--ok)}
.fact.pay-onsite{background:var(--warn-soft);border-color:transparent} .fact.pay-onsite b{color:var(--warn)}
.fact.pay-deposit{background:var(--accent-soft);border-color:transparent} .fact.pay-deposit b{color:var(--accent)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:10}
.modal.hidden{display:none}
.modal-box{background:var(--panel);border-radius:14px;padding:20px 22px;width:640px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-box h2{margin:0 0 14px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fgrid .full{grid-column:1/-1}
.fgrid>div:has(>label):not(.cb){display:flex;flex-direction:column;justify-content:flex-end}
.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fgrid .cb{display:flex;align-items:center;gap:8px;padding-top:20px} .fgrid .cb input{width:auto}
.hint{font-size:12px;margin-top:4px;color:var(--ok)}
.actions{display:flex;gap:8px;margin-top:18px}
.err{color:var(--bad);font-size:13px;margin-top:8px}
iframe.map{width:100%;height:420px;border:0;border-radius:10px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
@media (max-width:760px){
  #app{flex-direction:column;height:auto} #sidebar{width:auto} #tripList{max-height:180px}
  #main{padding:16px} .fgrid{grid-template-columns:1fr} .day{grid-template-columns:1fr} .dcol{border:none;text-align:left}
}
@media print{
  #sidebar,.toolbar,.tabs,.item-actions,.noprint,button{display:none!important}
  #main{overflow:visible;padding:0} #app{height:auto} body{background:#fff;color:#000}
  .card{box-shadow:none;break-inside:avoid}
}

<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// URLs in free text become links; trailing punctuation («…ссылка).») stays outside the link
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+?)([.,;:!?)»]*)(?=\s|$|&lt;)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>$2');
// Only web, phone and mail links are allowed in href (a «javascript:» link in shared data must not run);
// «booking.com/…» without a scheme gets https://
const safeUrl = u => { u = String(u || '').trim(); if (!u) return ''; if (/^(https?:|tel:|mailto:)/i.test(u)) return u; return /^[\w-]+(\.[\w-]+)+([/?#:]|$)/.test(u) ? 'https://' + u : ''; };
// «+385 98 964 8527, host@mail.com, https://…» → clickable phone / e-mail / web links
const contactHtml = s => esc(s).replace(/(https?:\/\/[^\s<,]+)|([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|(\+?\d[\d\s()-]{6,}\d)/g, (m, url, mail, tel) =>
  url ? `<a href="${url}" target="_blank" rel="noopener">${url}</a>` : mail ? `<a href="mailto:${mail}">${mail}</a>` : `<a href="tel:${tel.replace(/[^\d+]/g, '')}">${tel}</a>`);
const uid = () => Math.random().toString(36).slice(2, 10);
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const iso = dt => dt.toISOString().slice(0, 10);
const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const diff = (a, b) => Math.round((D(b) - D(a)) / 864e5);
const today = () => { const n = new Date(); return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`; };
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const WDF = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fmt = s => { if (!s) return ''; const d = D(s); return `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`; };
const fmtY = s => s ? `${fmt(s)} ${D(s).getUTCFullYear()}` : '';
const dmy = s => s ? s.split('-').reverse().join('.') : '';
const wd = s => WD[D(s).getUTCDay()];
const isWeekend = s => [0, 6].includes(D(s).getUTCDay());
const plural = (n, a, b, c) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c; };
const nights = n => `${n} ${plural(n, 'ночь', 'ночи', 'ночей')}`;
const days = n => `${n} ${plural(n, 'день', 'дня', 'дней')}`;
const num = v => (v === '' || v == null || isNaN(+v)) ? 0 : +v;
const byDateTime = (a, b) => (a.date || '9999').localeCompare(b.date || '9999') || (a.time || '99').localeCompare(b.time || '99');
// toast(msg) — a short message; toast(msg, undo) — with an «Отменить» button for 6 seconds
function toast(msg, undo) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('has-btn', !!undo);
  if (undo) { const b = document.createElement('button'); b.textContent = 'Отменить'; b.onclick = () => { t.classList.remove('show'); undo(); }; t.append(' ', b); }
  t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), undo ? 6000 : 2200);
}
function download(name, data, type) {
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const safeName = s => (s || 'trip').replace(/[\\/:*?"<>|]+/g, '_').trim();

/* ================= Google Maps ================= */
function parseMap(url) {
  if (!url) return null;
  let u; try { u = decodeURIComponent(url.replace(/\+/g, ' ')); } catch { u = url; }
  const r = {url, short: /goo\.gl|maps\.app/i.test(url)};
  const m = u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)
         || u.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/);
  if (m) { r.lat = +m[1]; r.lng = +m[2]; }
  let n = u.match(/\/place\/([^/@?]+)/);
  if (n) r.name = n[1].trim();
  else { n = u.match(/[?&](?:q|query)=([^&]+)/); if (n && !/^-?\d+\.\d+,/.test(n[1])) r.name = n[1].trim(); }
  return r;
}
// The point an item (stay / place) is bound to. Its name is only a label: renaming never moves the point.
// exact: explicit binding (it.lat/lng) or coordinates in its Google link; loose: also a point found by name search
const hasBind = it => it.lat !== '' && it.lat != null && !isNaN(+it.lat);
function itemCoords(it, loose = true) {
  if (hasBind(it)) return {lat: +it.lat, lng: +it.lng};
  const m = parseMap(it.mapUrl); if (m?.lat != null) return {lat: m.lat, lng: m.lng};
  if (loose && it.info?.lat != null && !infoFar(it)) return {lat: it.info.lat, lng: it.info.lng};
  return null;
}
// What to put into Google Maps for an item: coordinates > address > name+city
function mapTarget(it) {
  const c = itemCoords(it, false);
  if (c) return `${c.lat},${c.lng}`;
  const p = parseMap(it.mapUrl);
  if (it.address) return it.address + (it.city && !it.address.includes(it.city) ? ', ' + it.city : '');
  if (p && p.name) return p.name;
  const n = it.name || it.title;
  return n ? [n, it.city].filter(Boolean).join(', ') : '';
}
function mapOpenUrl(it) {
  if (safeUrl(it.mapUrl)) return safeUrl(it.mapUrl);
  const t = mapTarget(it); return t ? searchUrl(t) : '';
}
const searchUrl = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
// Query for Google Maps search: name + address (or city), skipping parts already contained
/* ---- Google Plus Codes («RX38+4P, Lozovac») and raw coordinates ---- */
const OLC = '23456789CFGHJMPQRVWX', OLC_RES = [20, 1, .05, .0025, .000125];
const PLUS_RE = /\b([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,7})\b/i;
function olcDecode(code) {
  code = code.toUpperCase().replace('+', '');
  let lat = -90, lng = -180, rLat = 20, rLng = 20;
  for (let i = 0; i < Math.min(code.length, 10); i += 2) {
    rLat = rLng = OLC_RES[i / 2];
    lat += OLC.indexOf(code[i]) * rLat; lng += OLC.indexOf(code[i + 1] || '2') * rLng;
  }
  for (let i = 10; i < code.length; i++) { rLat /= 5; rLng /= 4; const d = OLC.indexOf(code[i]); lat += Math.floor(d / 4) * rLat; lng += (d % 4) * rLng; }
  return {lat: lat + rLat / 2, lng: lng + rLng / 2};
}
function olcPrefix(lat, lng, len) {
  let la = Math.min(Math.max(lat, -90), 89.9999999) + 90, ln = ((lng + 180) % 360 + 360) % 360, s = '';
  for (let p = 0; p * 2 < len; p++) { const r = OLC_RES[p], a = Math.floor(la / r), b = Math.floor(ln / r); s += OLC[a] + OLC[b]; la -= a * r; ln -= b * r; }
  return s;
}
// Full code → coordinates; short code needs a reference point (the locality written next to it)
function olcRecover(code, ref) {
  const sep = code.indexOf('+');
  if (sep >= 8) return olcDecode(code);
  const pad = 8 - sep, res = Math.pow(20, 2 - pad / 2), half = res / 2;
  let {lat, lng} = olcDecode(olcPrefix(ref.lat, ref.lng, pad) + code);
  if (ref.lat + half < lat && lat - res >= -90) lat -= res; else if (ref.lat - half > lat && lat + res <= 90) lat += res;
  if (ref.lng + half < lng) lng -= res; else if (ref.lng - half > lng) lng += res;
  return {lat, lng};
}
const coordsUrl = (lat, lng) => `https://www.google.com/maps/search/?api=1&query=${(+lat).toFixed(6)},${(+lng).toFixed(6)}`;
const stripPlus = s => (s || '').replace(PLUS_RE, '').replace(/^[\s,]+|[\s,]+$/g, '').replace(/\s*,\s*,\s*/g, ', ');
// "RX38+4P, 22221, Lozovac" / "43.805, 15.964" → {lat, lng}; null if the text is something else
async function resolveLocationText(text) {
  text = (text || '').trim(); if (!text || /^https?:/i.test(text)) return null;
  const c = text.match(/^(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)$/);
  if (c) return {lat: +c[1], lng: +c[2], kind: 'coords'};
  // 45°27'20.9"N 15°34'24.7"E
  const dms = text.match(/^(\d{1,2})°\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([NSСЮ])[\s,;]+(\d{1,3})°\s*(\d{1,2})['′]\s*(\d{1,2}(?:[.,]\d+)?)["″]?\s*([EWВЗ])$/i);
  if (dms) {
    const v = (d, m, s, h) => (+d + m / 60 + parseFloat(s.replace(',', '.')) / 3600) * (/[SWЮЗ]/i.test(h) ? -1 : 1);
    return {lat: v(dms[1], dms[2], dms[3], dms[4]), lng: v(dms[5], dms[6], dms[7], dms[8]), kind: 'coords'};
  }
  const m = text.match(PLUS_RE); if (!m) return null;
  const code = m[1].toUpperCase();
  if (code.indexOf('+') >= 8) return {...olcDecode(code), kind: 'plus'};
  const locality = stripPlus(text); if (!locality) throw new Error('у короткого Plus Code нужен населённый пункт, например «RX38+4P, Lozovac»');
  const ref = await geocode(locality);
  return {...olcRecover(code, ref), kind: 'plus'};
}
// Photon (komoot) — fuzzy OpenStreetMap search, used as a fallback and in the map picker
async function photon(q, near) {
  const j = await getJson(`https://photon.komoot.io/api/?limit=6&q=${encodeURIComponent(q)}${near ? `&lat=${near.lat}&lon=${near.lng}` : ''}`);
  return (j.features || []).map(f => { const p = f.properties || {}; return {lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0], name: p.name || p.street || '',
    city: p.city || p.town || p.village || p.county || '', country: p.country || '', cc: (p.countrycode || '').toLowerCase(), osm: p.osm_type && p.osm_id ? p.osm_type + p.osm_id : '', cls: p.osm_key === 'amenity' ? 'amenity:' + p.osm_value : p.osm_key || '',
    address: [p.street && [p.street, p.housenumber].filter(Boolean).join(' '), p.postcode, p.city || p.town || p.village, p.country].filter(Boolean).join(', ')}; });
}
function searchQuery(it) {
  const parts = [];
  for (let p of [it.name || it.title, it.address, it.city]) { p = stripPlus(p); if (p && !parts.some(x => x.toLowerCase().includes(p.toLowerCase()))) parts.push(p); }
  return parts.join(', ');
}
// Short share links (maps.app.goo.gl) can only be expanded by the home server (the browser cannot follow them)
async function expandShortLink(url) {
  if (!location.protocol.startsWith('http')) throw new Error('короткую ссылку можно раскрыть, только когда приложение открыто через start.bat (сервер). Откройте ссылку в браузере и вставьте полную ссылку или координаты');
  try { return (await api('GET', '/api/resolve?url=' + encodeURIComponent(url))).data.url; }
  catch (e) { throw new Error(/404/.test(e.message) ? 'перезапустите сервер (start.bat) — он обновился' : 'не удалось раскрыть короткую ссылку'); }
}
const SRC_LABEL = {link: 'по ссылке Google', coords: 'по координатам', pick: 'выбрано на карте', search: 'найдено по названию/адресу', address: 'по адресу из ссылки'};
// Text from the «Место на карте» field → an exact point. Only exact sources are accepted:
// a Google Maps link (short «Поделиться» link or full) or coordinates «45.4558, 15.5735» / a Plus Code.
// The place name from the link is offered as the default title; the title can be changed freely.
const NEED_EXACT = 'Вставьте ссылку из Google Maps («Поделиться» → «Копировать ссылку») или координаты (правая кнопка мыши по месту в Google Maps → первая строка меню)';
async function resolveLoc(text) {
  text = (text || '').trim(); if (!text) return null;
  if (/^https?:/i.test(text)) {
    let url = text, p = parseMap(url);
    if (p.lat == null && p.short) { url = await expandShortLink(text); p = parseMap(url); }
    if (p.lat != null) return {lat: p.lat, lng: p.lng, src: 'link', label: placeNameFromLink(p.name)};
    throw new Error('в этой ссылке нет координат. ' + NEED_EXACT);
  }
  const loc = await resolveLocationText(text);
  if (loc) return {lat: loc.lat, lng: loc.lng, src: 'coords', label: ''};
  throw new Error('по названию или адресу точку не ищем — она была бы неточной. ' + NEED_EXACT);
}
// «Turanj 103k, 47106 Karlovac, Croatia» in a /place/ link → keep it readable; plain coordinates are not a name
const placeNameFromLink = n => !n || /^-?\d+\.\d+,/.test(n) ? '' : n.replace(/\s+/g, ' ').trim();
const routeUrl = pts => 'https://www.google.com/maps/dir/' + pts.map(encodeURIComponent).join('/');
function mapButtons(it) {
  const url = mapOpenUrl(it); if (!url) return '';
  const label = safeUrl(it.mapUrl) ? I('map') + ' Карта' : I('search') + ' Найти';
  return `<a class="pill acc" href="${esc(url)}" target="_blank" rel="noopener" title="${it.mapUrl ? 'Открыть ссылку Google Maps' : 'Поиск в Google Maps по названию/адресу'}">${label}</a>`
       + (mapTarget(it) ? ` <a class="pill" href="#" data-preview="${esc(mapTarget(it))}" title="Показать карту здесь">${I('eye')}</a>` : '');
}

/* ================= dictionaries ================= */
const PLACE_CATS = {sight:'🏛 Достопримечательность', museum:'🖼 Музей', food:'🍽 Еда', nature:'🌲 Природа', beach:'🏖 Пляж', activity:'🎟 Активность', shop:'🛍 Покупки', other:'📌 Другое'};
const PRIOS = {must:'⭐ Обязательно', want:'👍 Хочу', maybe:'🤔 Если будет время'};
const TRANSPORT = {plane:'✈️ Самолёт', train:'🚆 Поезд', bus:'🚌 Автобус', car:'🚗 Авто', ferry:'⛴ Паром', taxi:'🚕 Такси', walk:'🚶 Пешком', other:'🚀 Другое'};
const ACC_TYPES = {hotel:'🏨 Отель', apart:'🏠 Апартаменты', hostel:'🛏 Хостел', camping:'⛺ Кемпинг', friends:'👋 У друзей', transport:'🚆 В дороге (ночной транспорт)', other:'🛌 Другое'};
const PAY = {'': '— Не указано', paid: '✅ Оплачено', onsite: '💳 Оплата на месте', deposit: '💶 Внесена предоплата'};
// check-in / check-out time is free text: «15:00–22:00», «до 18:00», «с 14:00, ключ в ящике».
// A bare «15:00» keeps its old meaning: check-in «с 15:00», check-out «до 11:00».
const bareTime = v => /^\d{1,2}[:.]\d{2}$/.test((v || '').trim());
const inTime = s => !s.checkInTime ? '' : bareTime(s.checkInTime) ? 'с ' + s.checkInTime.trim() : s.checkInTime.trim();
const outTime = s => !s.checkOutTime ? '' : bareTime(s.checkOutTime) ? 'до ' + s.checkOutTime.trim() : s.checkOutTime.trim();
const payPill = s => s.pay === 'paid' ? `<span class="pill ok">${I('check')} оплачено</span>` : s.pay === 'onsite' ? '<span class="pill warn">оплата на месте</span>'
  : s.pay === 'deposit' ? '<span class="pill acc">предоплата внесена</span>' : '';

function tripRange(t) {

/* ---- route map: main stops in order connected by lines ---- */
function tripStops(t) {
  const stops = [], dl = tripDays(t);
  dl.forEach((d, i) => {
    dayRoute(t, d).forEach(c => {
      const l = stops[stops.length - 1];
      if (l && samePlace(l.name, c)) l.to = d; else stops.push({name: c, from: d, to: d, sleeps: 0});
    });
    // where the day ends is where we spend the night (except the last day)
    if (i < dl.length - 1 && stops.length) stops[stops.length - 1].sleeps++;
  });
  stops.forEach(s => {
    s.stays = t.stays.filter(x => stayAt(x, s.name) && x.checkIn >= s.from && x.checkIn <= s.to);
    s.nights = s.stays.reduce((a, x) => a + diff(x.checkIn, x.checkOut), 0) || s.sleeps;
  });
  return stops;
}
function legBetween(t, a, b) {

async function reverseGeocode(lat, lng) {
  await nomSlot();
  const j = await getJson(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&addressdetails=1&namedetails=1&accept-language=ru&lat=${lat}&lon=${lng}`);
  const a = j.address || {};
  return {name: j.name || j.namedetails?.name || '', city: a.city || a.town || a.village || a.municipality || a.county || '',
    address: [a.road && [a.road, a.house_number].filter(Boolean).join(' '), a.postcode, a.city || a.town || a.village, a.country].filter(Boolean).join(', '), cc: a.country_code || '', country: a.country || ''};
}

  // start: current point → the city → the trip's last known place → Europe
  let center = start, zoom = start ? 15 : 5;
  if (!center && city) { try { center = await geocode(city); zoom = 12; } catch {} }
  if (!center) { const g = Object.values(state.geo || {}).pop(); if (g) { center = g; zoom = 7; } }
  const map = L.map('pkMap').setView(center ? [center.lat, center.lng] : [46, 15], center ? zoom : 5);
  const esri = svc => L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/${svc}/MapServer/tile/{z}/{y}/{x}`, {attribution: 'Tiles © Esri', maxZoom: 18});
  const bases = {'Улицы': esri('World_Street_Map'), 'Спутник': esri('World_Imagery')};
  bases['Улицы'].addTo(map); L.control.layers(bases, null, {position: 'topright'}).addTo(map);
  new ResizeObserver(() => map.invalidateSize()).observe($('#pkMap'));
  let marker = null, chosen = null;
  const pick = async (lat, lng, info) => {
    if (!marker) { marker = L.marker([lat, lng], {draggable: true}).addTo(map); marker.on('dragend', () => { const p = marker.getLatLng(); pick(p.lat, p.lng); }); }
    else marker.setLatLng([lat, lng]);
    chosen = {lat, lng, ...(info || {})};
    $('#pkOk').disabled = false;
    $('#pkSel').innerHTML = `📍 <b>${esc(chosen.name || '…')}</b> ${esc(chosen.address || '')} <span class="muted">· ${lat.toFixed(5)}, ${lng.toFixed(5)}</span>`;
    if (!info) {
      try { const r = await reverseGeocode(lat, lng); if (chosen.lat === lat && chosen.lng === lng) { Object.assign(chosen, r); $('#pkSel').innerHTML = `📍 <b>${esc(r.name || 'точка')}</b> ${esc(r.address)} <span class="muted">· ${lat.toFixed(5)}, ${lng.toFixed(5)}</span>`; } } catch {}
    }
  };
  if (start) pick(start.lat, start.lng);
  map.on('click', e => pick(e.latlng.lat, e.latlng.lng));
  const search = async () => {
    const q = $('#pkQ').value.trim(), res = $('#pkRes'); if (!q) return;
    res.innerHTML = '<span class="small muted">⏳ Ищу…</span>';
    try {
      const loc = await resolveLocationText(q);
      if (loc) { res.innerHTML = ''; map.setView([loc.lat, loc.lng], 16); return pick(loc.lat, loc.lng); }
      // search around the place's city; if nothing there — around the visible map
      let {list, ref} = await findPlaces(q, {city, maxKm: 60, all: true});
      if (!list.length) { const c = map.getCenter(); ({list, ref} = await findPlaces(q, {near: {lat: c.lat, lng: c.lng}, maxKm: 300, all: true})); }
      list = list.slice(0, 8);
      if (!list.length) { res.innerHTML = `<span class="small" style="color:var(--bad)">Рядом${city ? ' с ' + esc(city) : ''} ничего не найдено — попробуйте по-английски или по-местному, либо кликните по карте</span>`; return; }
      res.innerHTML = list.map((r, i) => `<button type="button" class="sm" data-pk="${i}">📍 ${esc(r.name || '—')} <span class="muted">${esc([r.city, r.country].filter(Boolean).join(', ') || (r.address || '').split(',').slice(1, 3).join(','))}${r.km != null ? ` · ${r.km < 1 ? '<1' : Math.round(r.km)} км` : ''}</span></button>`).join('');
      res.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => { const r = list[+b.dataset.pk]; map.setView([r.lat, r.lng], 16); pick(r.lat, r.lng, r); });
      if (list.length === 1 || !start) { const r = list[0]; map.setView([r.lat, r.lng], 15); pick(r.lat, r.lng, r); }
    } catch (e) { res.innerHTML = `<span class="small" style="color:var(--bad)">⚠ ${esc(e.message)}</span>`; }
  };
  $('#pkForm').onsubmit = e => { e.preventDefault(); search(); };
  $('#pkOk').onclick = () => { if (chosen) { onPick(chosen); close(); } };
  if ((text || query) && !start) search();
}

async function buildGuide(t, opt, status) {
  if (opt.enrich || opt.refresh) {
    const todo = t.places.filter(p => opt.refresh ? searchQuery(p) : needsInfo(p));
    for (const [i, p] of todo.entries()) { status(`Ищу часы работы и фото: ${p.title} (${i + 1}/${todo.length})`); try { await enrichPlace(p); } catch {} }
    save();
  }
  const dl = tripDays(t), r = tripRange(t), stops = tripStops(t), stayC = new Map(), cityC = new Map();
  // cities of every day's route: coordinates for the day maps and the country (Schengen) for the summary
  const cities = [...new Set(dl.flatMap(d => dayRoute(t, d)))];
  for (const [i, c] of cities.entries()) { status(`Города и страны: ${c} (${i + 1}/${cities.length})`); try { cityC.set(c.toLowerCase(), await geocode(c, true)); } catch {} }
  save();
  if (opt.maps) {
    for (const [i, s] of stops.entries()) { status(`Координаты: ${s.name} (${i + 1}/${stops.length})`); try { s.c = await stopCoords(s); } catch {} }
    for (const s of t.stays) {
      const m = itemCoords(s, false);
      if (m) stayC.set(s.id, m);
      else { status(`Координаты жилья: ${s.name}`); try { stayC.set(s.id, await geocode(s.address ? [s.address, s.city].filter(Boolean).join(', ') : searchQuery(s))); } catch {} }
    }
    save();
  }
  if (opt.maps) { status('Маршруты по дорогам…'); await ensureLegGeoms(t, 30).catch(() => {}); }
  status('Погода…'); await ensureWeather(t).catch(() => {}); save();
  const roadPaths = xs => xs.filter(legGeom).map(x => ({pts: legGeom(x), color: LEG_COLORS[x.type] || '#2563eb'}));
  status('Собираю документ…');
  const color = cityColors(t), totalNights = Math.max(0, dl.length - 1);

  const link = (url, text) => safeUrl(url) ? `<a href="${esc(safeUrl(url))}">${text}</a>` : '';

    // merge stops at the same place (start = finish)

    pts.forEach(p => { const m = merged.find(q => Math.abs(q.lat - p.lat) < 1e-3 && Math.abs(q.lng - p.lng) < 1e-3); if (m) { m.label += ' · ' + p.label; m.sleep ||= p.sleep; } else merged.push({...p, label: String(p.label)}); });

// Put the guide into the page, wait for images and open the print dialog (→ «Сохранить как PDF»)
async function printHtml(html, title) {
  const g = $('#guide'); g.innerHTML = html;
  const imgs = [...g.querySelectorAll('img')];
  // wait until every image has loaded or finally failed (tiles are retried a few times)
  const t0 = Date.now();
  while (Date.now() - t0 < 40000 && imgs.some(i => !(i.complete && (i.naturalWidth || i.dataset.dead)))) await new Promise(r => setTimeout(r, 300));
  g.querySelectorAll('img.g-photo').forEach(i => { if (!i.naturalWidth) i.remove(); });
  const oldTitle = document.title; document.title = title;
  document.body.classList.add('print-guide');
  const done = () => { document.body.classList.remove('print-guide'); document.title = oldTitle; g.innerHTML = ''; window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  window.print();
}

/* ================= day editor ================= */
// Fix derived trip dates so shifting days keeps the trip length consistent
function pinRange(t) { const r = tripRange(t); t.start ||= r.start; t.end ||= r.end; }
function shiftKeys(o, from, n) {
  if (!o) return;
  const moved = Object.entries(o).filter(([k]) => k >= from);
  moved.forEach(([k]) => delete o[k]); moved.forEach(([k, v]) => o[addDays(k, n)] = v);
}
// New empty day at X: everything from X onwards moves one day later.
// A stay that spans X gets one more night; a stay that ends on X stays as is (a gap appears to fill).
function insertDay(t, X) {
  pinRange(t);
  const sh = s => s && s >= X ? addDays(s, 1) : s;
  t.places.forEach(p => p.date = sh(p.date)); t.transport.forEach(x => x.date = sh(x.date));
  t.stays.forEach(s => { if (s.checkIn >= X) { s.checkIn = addDays(s.checkIn, 1); s.checkOut = addDays(s.checkOut, 1); } else if (s.checkOut > X) s.checkOut = addDays(s.checkOut, 1); });
  shiftKeys(t.dayNotes, X, 1); shiftKeys(t.dayTitles, X, 1);
  t.end = X > t.end ? X : addDays(t.end, 1);
}
// What deleting day X would affect (for the confirmation)
function deleteDayImpact(t, X) {
  return {
    places: t.places.filter(p => p.date === X),
    transport: t.transport.filter(x => x.date === X),
    gone: t.stays.filter(s => s.checkIn <= X && X < s.checkOut && diff(s.checkIn, s.checkOut) === 1),
    shorter: t.stays.filter(s => s.checkIn <= X && X < s.checkOut && diff(s.checkIn, s.checkOut) > 1),
  };
}
// Remove day X: its places go to the wishlist, its transport is removed, its night is cut from the stay,
// everything after X moves one day earlier.
function deleteDay(t, X) {
  pinRange(t);
  const next = addDays(X, 1), sh = s => s && s > X ? addDays(s, -1) : s;
  t.places.forEach(p => { if (p.date === X) p.date = ''; else p.date = sh(p.date); });
  t.transport = t.transport.filter(x => x.date !== X); t.transport.forEach(x => x.date = sh(x.date));
  t.stays.forEach(s => { if (s.checkIn > X) { s.checkIn = addDays(s.checkIn, -1); s.checkOut = addDays(s.checkOut, -1); } else if (s.checkOut > X) s.checkOut = addDays(s.checkOut, -1); });
  t.stays = t.stays.filter(s => s.checkOut > s.checkIn);
  for (const o of [t.dayNotes, t.dayTitles]) if (o) { delete o[X]; shiftKeys(o, next, -1); }
  if (t.end >= X && t.end > t.start) t.end = addDays(t.end, -1);
}
// Swap the plans (places, title, note) of two days; stays and transport keep their dates
function swapDays(t, a, b) {
  t.places.forEach(p => { if (p.date === a) p.date = b; else if (p.date === b) p.date = a; });
  for (const o of [t.dayNotes ||= {}, t.dayTitles ||= {}]) { const va = o[a], vb = o[b]; delete o[a]; delete o[b]; if (vb) o[a] = vb; if (va) o[b] = va; }
}
// Move the whole trip by n days
function shiftTrip(t, n) {
  pinRange(t);
  const sh = s => s ? addDays(s, n) : s;
  t.start = sh(t.start); t.end = sh(t.end);
  t.places.forEach(p => p.date = sh(p.date)); t.transport.forEach(x => x.date = sh(x.date));
  t.stays.forEach(s => { s.checkIn = sh(s.checkIn); s.checkOut = sh(s.checkOut); s.cancelUntil = sh(s.cancelUntil); });
  for (const o of [t.dayNotes, t.dayTitles]) if (o) { const e = Object.entries(o); e.forEach(([k]) => delete o[k]); e.forEach(([k, v]) => o[addDays(k, n)] = v); }
}
function movePlaces(ids, date) { cur().places.forEach(p => { if (ids.includes(p.id)) p.date = date; }); }
const dayLabel = (t, d) => `${fmt(d)}, ${wd(d)} — ${t.dayTitles?.[d] || dayRoute(t, d).join(' → ') || 'день'}`;
function openDayMenu(d) {
  const t = cur(), dl = tripDays(t), i = dl.indexOf(d), np = t.places.filter(p => p.date === d).length;
  const opts = dl.filter(x => x !== d).map(x => `<option value="${x}">День ${dl.indexOf(x) + 1} · ${esc(dayLabel(t, x))}</option>`).join('');
  $('#modalBox').innerHTML = `<h2>⋯ День ${i + 1}: ${esc(dayLabel(t, d))}</h2>
    <div class="dm-row"><button data-dm="insBefore">➕ Вставить пустой день перед</button><button data-dm="insAfter">➕ Вставить пустой день после</button>
      <span class="small muted">все следующие дни сдвинутся на +1</span></div>
    <div class="dm-row"><button class="danger" data-dm="del">🗑 Удалить этот день</button><span class="small muted">все следующие дни сдвинутся на −1, места дня уйдут в «Хотелки»</span></div>
    ${opts ? `<div class="dm-row"><span>⇄ Поменять местами с</span><select id="dmSwap">${opts}</select><button data-dm="swap">Поменять</button>
      <span class="small muted">меняются места, название и заметка дня</span></div>
    <div class="dm-row"><span>📦 Перенести все места дня (${np}) на</span><select id="dmMove">${opts}<option value="">💭 Хотелки</option></select><button data-dm="move" ${np ? '' : 'disabled'}>Перенести</button></div>` : ''}
    <div class="dm-row"><span>↔ Сдвинуть всю поездку на</span><input id="dmShift" type="number" value="1" style="width:70px"><span>дн.</span><button data-dm="shift">Сдвинуть</button>
      <span class="small muted">минус — раньше</span></div>
    <div class="actions"><span class="grow"></span><button id="fCancel">Закрыть</button></div>`;
  $('#modal').classList.remove('hidden'); $('#fCancel').onclick = closeModal;
  $('#modalBox').onclick = e => {
    const a = e.target.closest('[data-dm]')?.dataset.dm; if (!a) return;
    if (a === 'insBefore') { insertDay(t, d); toast('Пустой день вставлен'); }
    else if (a === 'insAfter') { insertDay(t, addDays(d, 1)); toast('Пустой день вставлен'); }
    else if (a === 'del') {
      const im = deleteDayImpact(t, d), lines = [];
      if (im.places.length) lines.push(`• места (${im.places.length}) уйдут в «Хотелки»`);
      if (im.transport.length) lines.push(`• будут удалены переезды: ${im.transport.map(legText).join('; ')}`);
      if (im.shorter.length) lines.push(`• жильё станет на ночь короче: ${im.shorter.map(s => s.name).join(', ')}`);
      if (im.gone.length) lines.push(`• будет удалено жильё (одна ночь): ${im.gone.map(s => s.name).join(', ')}`);
      if (!confirm(`Удалить ${dayLabel(t, d)}?\nВсе следующие дни сдвинутся на день раньше.${lines.length ? '\n\n' + lines.join('\n') : ''}`)) return;
      deleteDay(t, d); toast('День удалён');
    }
    else if (a === 'swap') { swapDays(t, d, $('#dmSwap').value); toast('Дни поменялись местами'); }
    else if (a === 'move') { movePlaces(t.places.filter(p => p.date === d).map(p => p.id), $('#dmMove').value); toast('Места перенесены'); }
    else if (a === 'shift') { const n = parseInt($('#dmShift').value, 10); if (!n) return; shiftTrip(t, n); toast(`Поездка сдвинута на ${n > 0 ? '+' : ''}${n} дн.`); }
    $('#modalBox').onclick = null; closeModal(); commit();
  };
}

const actions = {
  newTrip() {
    openForm('trip', {travelers: 1, currency: '€', color: COLORS[state.trips.length % COLORS.length]}, out => {
      const t = normTrip({...out, id: uid()}); state.trips.push(t); state.currentId = t.id; state.tab = 'days'; commit();
    });
  },
  editTrip() {
    const t = cur(), old = tripRange(t);
    const outside = () => { const dl = tripDays(t); return [...t.places.filter(p => p.date && !dl.includes(p.date)), ...t.transport.filter(x => x.date && !dl.includes(x.date))].length; };
    const before = outside();
    openForm('trip', t, out => {
      const n1 = out.start && old.start ? diff(old.start, out.start) : 0, n2 = out.end && old.end ? diff(old.end, out.end) : 0;
      // both dates moved by the same number of days → offer to move the whole plan with them
      if (n1 && n1 === n2 && confirm(`Даты поездки сдвинуты на ${n1 > 0 ? '+' : ''}${n1} ${plural(Math.abs(n1), 'день', 'дня', 'дней')}.\n\nСдвинуть вместе с ними все дни плана (места, переезды, жильё, заметки)?\n\nОК — сдвинуть всё · Отмена — поменять только даты поездки`)) {
        t.start = old.start; t.end = old.end; shiftTrip(t, n1);
        Object.assign(t, {...out, start: t.start, end: t.end});
      } else Object.assign(t, out);
      commit();
      const after = outside();

    });
  },
  delTrip() {
    const t = cur(); if (!confirm(`Удалить поездку «${t.name}»? Совет: сначала сохраните её в файл (💾).`)) return;
    state.trips = state.trips.filter(x => x !== t); state.currentId = state.trips[0]?.id || null; commit();
  },
  dupTrip() {
    const t = cur(), c = normTrip(JSON.parse(JSON.stringify(t)));
    c.id = uid(); c.name = t.name + ' (копия)';
    for (const k of ['stays', 'places', 'transport', 'checklist']) c[k].forEach(x => x.id = uid());

  addStay(el) {
    const t = cur(), st = sortedStays(t), d = el?.dataset.date;
    const ci = d || st[st.length - 1]?.checkOut || tripRange(t).start || today();
    addItem('stays', {checkIn: ci, checkOut: addDays(ci, 1), type: 'hotel', city: d ? cityOn(t, d) : ''});
  },
  addPlace(el) { const d = el?.dataset.date || ''; addItem('places', {date: d, category: 'sight', priority: 'want', city: d ? cityOn(cur(), d) : ''}); },
  addTransport(el) {
    const t = cur(), d = el?.dataset.date || tripRange(t).start || '';
    const sameDay = t.transport.filter(x => x.date === d).sort(byDateTime).pop();
    const prev = t.transport.filter(x => x.date && x.date < d).sort(byDateTime).pop();
    addItem('transport', {date: d, type: sameDay?.type || prev?.type || 'car', from: sameDay ? (sameDay.to || '') : d ? placeAfter(t, addDays(d, -1)) : ''});
  },

  toWish(el) { const p = cur().places.find(x => x.id === el.dataset.id); if (p) { p.date = ''; commit(); toast('Перенесено в «Хотелки»'); } },
  async calcAll(btn) {
    const t = cur(), legs = t.transport.filter(x => legPoints(x).length > 1 && !num(x.distanceKm));
    btn.disabled = true; let ok = 0; const errs = [];
    for (const [i, x] of legs.entries()) {

      try { const r = await calcLeg(x); x.distanceKm = r.km; if (r.geom) { x.geom = r.geom; x.geomK = r.geomK; } if (r.min && !num(x.durationMin) && !durFromTimes(x)) x.durationMin = r.min; ok++; }

/* ================= shared access: sync with server.py (when the app is opened via http) ================= */
const SYNC_KEY = 'travelPlanner.sync';
var sync = {on: false, busy: false, timer: null, revs: {}, synced: {}, key: ''};
try { sync.key = localStorage.getItem('travelPlanner.key') || ''; } catch {}
try { Object.assign(sync, JSON.parse(localStorage.getItem(SYNC_KEY)) || {}); } catch {}
const persistSync = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify({revs: sync.revs, synced: sync.synced})); } catch {} };
const isDemo = t => /^Пример:/.test(t.name || '');
// weather and «route not found» markers are refreshed by every device on its own — they are not shared
const syncJson = t => JSON.stringify(t, (k, v) => k === 'weather' || k === 'geomFail' ? undefined : v);
const isDirty = t => sync.synced[t.id] !== syncJson(t);
function syncStatus(html, ok) { const el = $('#syncStatus'); if (el) { el.innerHTML = html; el.style.color = ok ? 'var(--ok)' : 'var(--bad)'; } }
async function api(method, url, body) {
  const r = await fetch(url, {method, headers: {'Content-Type': 'application/json', 'X-Trip-Key': sync.key}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) {
    const k = prompt('Пароль для общего доступа к поездкам:'); if (k == null) throw new Error('нужен пароль');
    sync.key = k; localStorage.setItem('travelPlanner.key', k); return api(method, url, body);
  }
  if (!r.ok && r.status !== 409) throw new Error('HTTP ' + r.status);
  return {status: r.status, data: await r.json()};
}
// Take changes from the server; returns true if something changed locally
function applyServer(data, first) {
  let changed = false;
  for (const s of data.trips) {
    const local = state.trips.find(t => t.id === s.id);
    if (local && sync.revs[s.id] === s.rev) continue;
    if (local && isDirty(local) && sync.revs[s.id] != null && sync.synced[s.id] !== syncJson(normTrip(s.data))) {
      if (!confirm(`Поездку «${s.data.name}» изменили на другом устройстве, а у вас есть несохранённые правки.\n\nОК — взять их версию (ваши последние правки пропадут)\nОтмена — оставить вашу версию и перезаписать`)) { sync.revs[s.id] = s.rev; continue; }
    }
    const t = normTrip(s.data);
    if (local?.weather) t.weather = local.weather;
    if (local) { Object.keys(local).forEach(k => delete local[k]); Object.assign(local, t); } else state.trips.push(t);
    sync.revs[s.id] = s.rev; sync.synced[s.id] = syncJson(t); changed = true;
  }
  for (const id of data.deleted || []) {
    const i = state.trips.findIndex(t => t.id === id);
    if (i >= 0 && (sync.revs[id] != null || first)) { state.trips.splice(i, 1); changed = true; }
    delete sync.revs[id]; delete sync.synced[id];
  }
  if (changed && !cur()) state.currentId = state.trips[0]?.id || null;
  persistSync();
  return changed;
}
async function pushDirty() {
  if (!sync.on || sync.busy) return;
  sync.busy = true;
  try {
    for (const t of [...state.trips]) {
      if (isDemo(t) || !isDirty(t)) continue;
      const json = syncJson(t);
      const r = await api('PUT', '/api/trips/' + t.id, {baseRev: sync.revs[t.id] || 0, data: JSON.parse(json)});
      if (r.status === 409) { if (applyServer({trips: [r.data]})) render(); sync.busy = false; return scheduleSync(); }
      sync.revs[t.id] = r.data.rev; if (syncJson(t) === json) sync.synced[t.id] = json;
    }
    for (const id of Object.keys(sync.revs)) if (!state.trips.some(t => t.id === id)) { await api('DELETE', '/api/trips/' + id); delete sync.revs[id]; delete sync.synced[id]; }
    persistSync();
    syncStatus(`🟢 Общий доступ · всё сохранено`, true);
  } catch (e) { syncStatus('🔴 Нет связи с сервером — изменения сохранены здесь и отправятся позже', false); }
  sync.busy = false;
  if (state.trips.some(t => !isDemo(t) && isDirty(t))) scheduleSync(3000);
}
function scheduleSync(ms = 700) { if (!sync || !sync.on) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushDirty, ms); }
const userIsEditing = () => !$('#modal').classList.contains('hidden') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '');
async function pollServer() {
  if (!sync.on || sync.busy || userIsEditing()) return;
  try {
    const r = await api('GET', '/api/trips');
    if (applyServer(r.data)) { save(); render(); }
    if (!state.trips.some(t => !isDemo(t) && isDirty(t))) syncStatus('🟢 Общий доступ · синхронизировано', true);
  } catch { syncStatus('🔴 Нет связи с сервером', false); }
}
async function syncInit() {
  if (!location.protocol.startsWith('http')) return; // opened as a file — local mode
  try { await api('GET', '/api/ping'); } catch { return; }
  try {
    const r = await api('GET', '/api/trips');
    sync.on = true;
    // the demo trip is not needed when the server already has real trips
    if (r.data.trips.length) state.trips = state.trips.filter(t => !isDemo(t) || r.data.trips.some(s => s.id === t.id));
    applyServer(r.data, true);
    if (!cur()) state.currentId = state.trips[0]?.id || null;
    localStorage.setItem(LS_KEY, JSON.stringify(state)); render();
    syncStatus(r.data.trips.length ? '🟢 Общий доступ · синхронизировано' : '🟢 Общий доступ. Сервер пока пуст — создайте поездку или загрузите бэкап (📂)', true);
    pushDirty();
    setInterval(pollServer, 4000);
  } catch (e) { syncStatus('🔴 Сервер найден, но доступ не получен: ' + esc(e.message), false); }
}

/* ================= ICS export ================= */
function buildIcs(t) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//travel-planner//RU', 'CALSCALE:GREGORIAN'];
  const icsEsc = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
  const dt = (d, tm) => d.replace(/-/g, '') + (tm ? 'T' + tm.replace(':', '') + '00' : '');
  const ev = (id, start, end, allDay, title, loc, desc) => {
    L.push('BEGIN:VEVENT', `UID:${id}@travel-planner`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
      allDay ? `DTSTART;VALUE=DATE:${dt(start)}` : `DTSTART:${start}`, allDay ? `DTEND;VALUE=DATE:${dt(end)}` : `DTEND:${end}`,
      `SUMMARY:${icsEsc(title)}`); if (loc) L.push(`LOCATION:${icsEsc(loc)}`); if (desc) L.push(`DESCRIPTION:${icsEsc(desc)}`); L.push('END:VEVENT');
  };
  t.stays.filter(s => s.checkIn && s.checkOut).forEach(s => ev(s.id, s.checkIn, s.checkOut, true, `🛏 ${s.name} (${s.city || ''})`, s.address || mapTarget(s),
    [s.confirmation && 'Бронь: ' + s.confirmation, s.mapUrl, s.bookingUrl, s.notes].filter(Boolean).join('\n')));
  t.transport.filter(x => x.date).forEach(x => {
    const allDay = !x.time;
    const end = x.timeTo ? dt(x.timeTo < x.time ? addDays(x.date, 1) : x.date, x.timeTo) : x.time ? dt(x.date, addMinutes(x.time, legDuration(x) || 60)) : dt(addDays(x.date, 1));
    ev(x.id, allDay ? x.date : dt(x.date, x.time), allDay ? addDays(x.date, 1) : end, allDay, `${icoTxt(TRANSPORT, x.type)} ${legText(x)} ${x.number || ''}`, x.from, [x.link, x.notes].filter(Boolean).join('\n'));
  });
  t.places.filter(p => p.date).forEach(p => ev(p.id, p.time ? dt(p.date, p.time) : p.date, p.time ? dt(p.date, addMinutes(p.time, 90)) : addDays(p.date, 1), !p.time,
    `${icoTxt(PLACE_CATS, p.category)} ${p.title}`, mapTarget(p), [p.mapUrl, p.link, p.notes].filter(Boolean).join('\n')));
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function addMinutes(tm, n) { const [h, m] = tm.split(':').map(Number); const v = Math.min(h * 60 + m + n, 23 * 60 + 59); return `${String(v / 60 | 0).padStart(2, '0')}:${String(v % 60).padStart(2, '0')}`; }

    {k: 'date', h: 'Дата', w: 12, date: true}, {k: 'wd', h: 'День', w: 13},
    {k: 'move', h: 'Переезды', w: 38}, {k: 'plan', h: 'Планы', w: 45}, {k: 'notes', h: 'Примечания', w: 45},
    {k: 'sleep', h: 'Ночёвка', w: 30}, {k: 'map', h: 'Карта жилья', w: 12}, {k: 'route', h: 'Маршрут дня', w: 13},
  ], dl.map((d, i) => {
    const s = stayForNight(t, d)[0], last = i === dl.length - 1;
    const pls = t.places.filter(p => p.date === d).sort(byDateTime);
    const morning = stayForNight(t, addDays(d, -1))[0];
    const pts = [morning && mapTarget(morning), ...pls.map(mapTarget), s && mapTarget(s)].filter(Boolean).filter((p, k, a) => p !== a[k - 1]);
    const ins = t.stays.filter(x => x.checkIn === d), outs = t.stays.filter(x => x.checkOut === d);
    const move = [...outs.map(x => `🧳 Выезд: ${x.name}${outTime(x) ? ' ' + outTime(x) : ''}`),
      ...t.transport.filter(x => x.date === d).sort(byDateTime).map(x => `${icoTxt(TRANSPORT, x.type)} ${x.time ? x.time + ' ' : ''}${legText(x)}${x.number ? ' (' + x.number + ')' : ''}${num(x.distanceKm) || legDuration(x) ? ' — ' + [num(x.distanceKm) && x.distanceKm + ' км', fmtDur(legDuration(x))].filter(Boolean).join(', ') : ''}`),
      ...ins.map(x => `🔑 Заезд: ${x.name}${inTime(x) ? ' ' + inTime(x) : ''}${x.pay === 'onsite' ? ' (оплата на месте)' : ''}`)].join('\n') || '—';
    const row = {
      date: xd(d), wd: WDF[D(d).getUTCDay()], move,
      // day note first, then notes of the day's places / transport / check-ins
      notes: [t.dayNotes?.[d],
        ...pls.filter(p => p.notes).map(p => `• ${p.title}: ${p.notes}`),
        ...t.transport.filter(x => x.date === d && x.notes).sort(byDateTime).map(x => `• ${legText(x)}: ${x.notes}`),
        ...ins.filter(x => x.notes).map(x => `• ${x.name}: ${x.notes}`)].filter(Boolean).join('\n'),
      plan: [t.dayTitles?.[d] && `▸ ${t.dayTitles[d]}`, ...pls.map(p => `• ${p.time ? p.time + ' ' : ''}${p.title}${p.done ? ' ✓' : ''}`)].filter(Boolean).join('\n'),
      sleep: last ? '🏁 конец поездки' : s ? `${s.name}${s.city ? ' (' + s.city + ')' : ''}`
        : (c => c ? `🏠 ${c} (жильё не указано)` : '⚠ нет жилья')(dayRoute(t, d).slice(-1)[0]),
      map: s && !last ? link(mapOpenUrl(s), '📍 Карта') : '', route: pts.length >= 2 ? link(routeUrl(pts), '🗺 Маршрут') : '',
    };
    if (!s && !last) row._mark = {sleep: 'FFFDE2E2'};
    if (isWeekend(d)) row._fill = 'FFFFF7ED';
    return row;
  }));

  // 3. Жильё
  const stRows = st.map(s => ({
    from: xd(s.checkIn), to: xd(s.checkOut), n: diff(s.checkIn, s.checkOut), city: s.city, type: lbl(ACC_TYPES, s.type), name: s.name, addr: s.address,
    map: link(mapOpenUrl(s), '📍 Карта'), book: link(s.bookingUrl, '🔗 Бронь'), conf: s.confirmation, times: [inTime(s) && 'заезд ' + inTime(s), outTime(s) && 'выезд ' + outTime(s)].filter(Boolean).join('\n'), pay: payTxt(s),
    cancel: xd(s.cancelUntil), notes: [s.contact, s.notes].filter(Boolean).join('\n'),
  }));
  const wsS = sheet('Жильё', [
    {k: 'from', h: 'Заезд', w: 12, date: true}, {k: 'to', h: 'Выезд', w: 12, date: true}, {k: 'n', h: 'Ночей', w: 8, align: 'center'}, {k: 'city', h: 'Город', w: 15},
    {k: 'type', h: 'Тип', w: 13}, {k: 'name', h: 'Название', w: 26}, {k: 'addr', h: 'Адрес', w: 30}, {k: 'map', h: 'Карта', w: 11}, {k: 'book', h: 'Бронь', w: 10},
    {k: 'conf', h: '№ брони', w: 14}, {k: 'pay', h: 'Оплата', w: 16}, {k: 'times', h: 'Время', w: 16}, {k: 'cancel', h: 'Отмена до', w: 12, date: true}, {k: 'notes', h: 'Примечания', w: 40},
  ], stRows);
  if (stRows.length) { const tr = wsS.addRow([]); tr.getCell(1).value = 'Итого'; tr.getCell(3).value = {formula: `SUM(C4:C${3 + stRows.length})`}; tr.font = {bold: true}; }

  // 4. Места
  sheet('Места', [
    {k: 'date', h: 'Дата', w: 12, date: true}, {k: 'time', h: 'Время', w: 8}, {k: 'city', h: 'Город', w: 15}, {k: 'title', h: 'Место', w: 30},
    {k: 'cat', h: 'Категория', w: 20}, {k: 'prio', h: 'Приоритет', w: 18}, {k: 'map', h: 'Карта', w: 11}, {k: 'link', h: 'Сайт', w: 10},
    {k: 'done', h: 'Посещено', w: 10, align: 'center'}, {k: 'notes', h: 'Примечания', w: 40},
  ], [...t.places].sort(byDateTime).map(p => ({
    date: p.date ? xd(p.date) : 'без даты', time: p.time, city: p.city, title: p.title, cat: lbl(PLACE_CATS, p.category), prio: lbl(PRIOS, p.priority),
    map: link(mapOpenUrl(p), '📍 Карта'), link: link(p.link, '🔗'), done: p.done ? '✓' : '', notes: p.notes,
    _fill: p.done ? 'FFDCFCE7' : null,
  })));

  // 5. Транспорт
  sheet('Транспорт', [
    {k: 'date', h: 'Дата', w: 12, date: true}, {k: 'time', h: 'Время', w: 13}, {k: 'type', h: 'Тип', w: 12}, {k: 'from', h: 'Откуда', w: 18}, {k: 'via', h: 'Через', w: 18}, {k: 'to', h: 'Куда', w: 18},
    {k: 'num', h: 'Рейс / №', w: 12}, {k: 'km', h: 'Км', w: 9, align: 'right'}, {k: 'dur', h: 'В пути', w: 13},
    {k: 'link', h: 'Билет', w: 10}, {k: 'route', h: 'Маршрут', w: 11}, {k: 'notes', h: 'Примечания', w: 40},
  ], [...t.transport].sort(byDateTime).map(x => ({
    date: xd(x.date), time: [x.time, x.timeTo].filter(Boolean).join(' → '), type: lbl(TRANSPORT, x.type), from: x.from, via: legVia(x).join(', '), to: x.to, num: x.number,
    km: num(x.distanceKm) || '', dur: fmtDur(legDuration(x)),
    link: link(x.link, '🎫 Билет'), route: legPoints(x).length > 1 ? link(routeUrl(legPoints(x)), '🗺') : '', notes: x.notes,
  })));

  // 7. Чек-лист
  if (t.checklist.length) sheet('Чек-лист', [{k: 'd', h: '✓', w: 5, align: 'center'}, {k: 'x', h: 'Пункт', w: 60}],
    t.checklist.map(c => ({d: c.done ? '✓' : '☐', x: c.text, _fill: c.done ? 'FFDCFCE7' : null})), {noFilter: true});

  const buf = await wb.xlsx.writeBuffer();
  download(safeName(t.name) + '.xlsx', new Blob([buf], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  toast('Excel готов 📊');
}
function exportCsv(t) {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['С', 'По', 'Ночей', 'Город', 'Жильё', 'Адрес', 'Карта', 'Что посмотреть', 'Примечания']];
  sortedStays(t).forEach(s => rows.push([dmy(s.checkIn), dmy(s.checkOut), diff(s.checkIn, s.checkOut), s.city, s.name, s.address, mapOpenUrl(s),
    t.places.filter(p => p.date && p.date >= s.checkIn && p.date < s.checkOut).sort(byDateTime).map(p => `${fmt(p.date)} ${p.title}`).join('; '), s.notes]));
  download(safeName(t.name) + '.csv', '\ufeff' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv');
}
